<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion · Saint Augustin</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Montserrat',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:
    radial-gradient(1000px 500px at 20% -10%, rgba(184,145,47,.25), transparent 60%),
    linear-gradient(160deg,#0c1f3a,#122a4d);}
  .card{background:#fff;border-radius:20px;width:400px;max-width:100%;padding:36px 32px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
  .brand{text-align:center;margin-bottom:8px}
  .brand img{width:64px;height:64px;object-fit:contain;border-radius:14px}
  .brand h1{font-family:'Playfair Display',serif;font-size:22px;color:#122a4d;margin-top:8px}
  .brand p{color:#8a8370;font-size:13px;margin-top:2px}
  .tabs{display:flex;background:#f3eee2;border-radius:12px;padding:4px;margin:20px 0 18px}
  .tabs button{flex:1;border:none;background:transparent;padding:10px;border-radius:9px;font-weight:700;font-size:14px;color:#6b6b6b;cursor:pointer}
  .tabs button.active{background:#fff;color:#122a4d;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .social{display:flex;flex-direction:column;gap:10px}
  .soc-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;border:1px solid #e3dccb;background:#fff;color:#222}
  .soc-btn:hover{border-color:#b8912f}
  .soc-btn.google svg{width:18px;height:18px}
  .soc-btn.facebook{background:#1877f2;border-color:#1877f2;color:#fff}
  .divider{display:flex;align-items:center;gap:12px;color:#9a937f;font-size:12px;margin:18px 0;text-transform:uppercase;letter-spacing:.5px}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:#e6e0d2}
  .field{margin-bottom:12px}
  .field input{width:100%;padding:12px 14px;border:1px solid #e3dccb;border-radius:10px;font-size:14px;font-family:inherit}
  .field input:focus{outline:none;border-color:#b8912f}
  .btn-primary{width:100%;background:#122a4d;color:#fff;border:none;padding:13px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}
  .btn-primary:hover{background:#0c1f3a}
  .error{background:#fdecea;color:#c0392b;border:1px solid #f6c6c0;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px;display:none}
  .hint{text-align:center;color:#9a937f;font-size:12px;margin-top:16px;line-height:1.6}
  .back{margin-top:18px;text-align:center}
  .back a{color:#e3c578;font-weight:600;text-decoration:none}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="assets/logo.png" alt="Saint Augustin">
      <h1>Saint Augustin</h1>
      <p>Tourisme &amp; Voyages</p>
    </div>

    <div class="tabs">
      <button id="tabLogin" class="active" onclick="setMode('login')">Se connecter</button>
      <button id="tabRegister" onclick="setMode('register')">Créer un compte</button>
    </div>

    <div class="error" id="errBox"></div>

    <div class="social">
      <button class="soc-btn google" onclick="go('google')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34a853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#fbbc05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#ea4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84C6.71 7.3 9.14 5.38 12 5.38z"/></svg>
        Continuer avec Google
      </button>
      <button class="soc-btn facebook" onclick="go('facebook')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.7 4.6-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.3l-.5 3.5h-2.8v8.4A12 12 0 0 0 24 12z"/></svg>
        Continuer avec Facebook
      </button>
    </div>

    <div class="divider">ou</div>

    <form id="authForm">
      <div class="field" id="nameField" style="display:none"><input id="name" type="text" placeholder="Nom complet"></div>
      <div class="field"><input id="email" type="email" placeholder="Adresse email" required></div>
      <div class="field"><input id="password" type="password" placeholder="Mot de passe" required autocomplete="off"></div>
      <button class="btn-primary" id="submitBtn" type="submit">Se connecter</button>
    </form>

    <p class="hint">Les réservations et devis vous seront envoyés par email / téléphone.</p>
    <div class="back"><a href="index.html">← Retour au site</a></div>
  </div>

<script>
  const API = {
    base: '/api',
    get token(){ return localStorage.getItem('satv_token'); },
    set token(v){ v ? localStorage.setItem('satv_token', v) : localStorage.removeItem('satv_token'); },
    request: async (method, path, body) => {
      const headers = {'Content-Type':'application/json'};
      if (API.token) headers['Authorization'] = 'Bearer ' + API.token;
      const res = await fetch(API.base + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
      const data = await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(data.error || 'Erreur');
      return data;
    }
  };
  let mode = 'login';
  function setMode(m){ mode = m;
    document.getElementById('tabLogin').classList.toggle('active', m==='login');
    document.getElementById('tabRegister').classList.toggle('active', m==='register');
    document.getElementById('nameField').style.display = m==='register' ? '' : 'none';
    document.getElementById('submitBtn').textContent = m==='login' ? 'Se connecter' : 'Créer mon compte';
    hideErr();
  }
  function go(p){ if(p==='google') window.location.href='/api/auth/google/login';
                 else window.location.href='/api/auth/facebook/login'; }
  function showErr(msg){ const e=document.getElementById('errBox'); e.textContent=msg; e.style.display='block'; }
  function hideErr(){ const e=document.getElementById('errBox'); e.style.display='none'; }

  document.getElementById('authForm').addEventListener('submit', async (ev)=>{
    ev.preventDefault();
    hideErr();
    const email=document.getElementById('email').value.trim();
    const password=document.getElementById('password').value;
    try{
      if(mode==='register'){
        const name=document.getElementById('name').value.trim();
        if(!name) return showErr('Veuillez indiquer votre nom.');
        const d = await API.request('POST','/auth/register',{name,email,password});
        API.token = d.token;
        redirectAfterLogin();
      } else {
        const d = await API.request('POST','/auth/login',{email,password});
        API.token = d.token;
        redirectAfterLogin();
      }
    }catch(e){ showErr(e.message); }
  });

  function redirectAfterLogin(){
    const r = localStorage.getItem('satv_redirect');
    localStorage.removeItem('satv_redirect');
    window.location.href = r || 'index.html';
  }
</script>
</body>
</html>
